name: Reader feedback
description: Tell us where a step was useful, unclear, or hard to use.
title: "[Feedback] "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping make this guide useful. This is a public repository, not a case-support service. Do not include bills, names, account numbers, diagnoses, medical records, or private correspondence. General examples are enough.
  - type: input
    id: page
    attributes:
      label: Which page or play?
      placeholder: "Medical-bill kit, insurance denial route; or play 04.4"
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: What were you trying to understand or do?
      description: Describe the general task without personal case details.
    validations:
      required: true
  - type: textarea
    id: obstacle
    attributes:
      label: Where did the page help or leave you stuck?
      description: A confusing sentence, missing step, broken link, or mobile/print problem is useful feedback.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: What would make this clearer?
      description: Optional. If suggesting a factual change, include an official source URL.
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I have removed personal and sensitive information and understand this feedback is public.
          required: true
